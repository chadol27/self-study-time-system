<script>
  /* global bootstrap, teacherEpoch, token, authFail, seatDraftDirty, seatLoadCount, teacherNameDirty, teacherNameBusy, discardTeacherNameDraft */
  let extraDirectory = null;
  let extraDirectoryLoading = false;
  let extraDirectoryError = "";
  let extraLoadId = 0;
  let extraOperationCount = 0;
  let extraLeaveApproved = false;
  let extraCurrent = extraEmptyState();
  const extraElement = (id) => document.getElementById(`extra-${id}`);
  function extraEmptyState() {
    return {
      date: "",
      period: 1,
      rows: new Map(),
      generations: {},
      readOnly: true,
      loading: false,
      running: false,
      request: null,
      errors: [],
      notice: "",
    };
  }
  function extraState() {
    return extraCurrent;
  }
  function extraOperationBusy() {
    return extraOperationCount > 0;
  }
  function extraBusy(state = extraCurrent) {
    return state.loading || state.running || !!state.request;
  }
  function extraPending() {
    const state = extraCurrent;
    return (
      !!state.request ||
      Array.from(state.rows.values()).some(
        (row) =>
          row.isNew ||
          row.checked !== row.initialChecked ||
          (!state.readOnly &&
            !["2", "3"].includes(row.values[state.period - 1])),
      )
    );
  }
  function confirmExtraLeave() {
    extraLeaveApproved = false;
    if (
      extraOperationBusy() ||
      (typeof seatLoadCount !== "undefined" && seatLoadCount > 0) ||
      (typeof teacherNameBusy !== "undefined" && teacherNameBusy)
    ) {
      window.alert("처리 중입니다. 완료 후 이동해 주세요.");
      return false;
    }
    const dirty =
      extraPending() ||
      (typeof seatDraftDirty !== "undefined" && seatDraftDirty) ||
      (typeof teacherNameDirty !== "undefined" && teacherNameDirty);
    extraLeaveApproved =
      !dirty ||
      window.confirm(
        "저장되지 않은 변경사항이 있습니다. 취소를 누른 뒤 저장하세요.",
      );
    if (extraLeaveApproved) discardTeacherNameDraft();
    return extraLeaveApproved;
  }
  window.addEventListener("beforeunload", (event) => {
    if (
      !extraPending() &&
      !extraOperationBusy() &&
      !(typeof seatDraftDirty !== "undefined" && seatDraftDirty) &&
      !(typeof teacherNameDirty !== "undefined" && teacherNameDirty) &&
      !(typeof teacherNameBusy !== "undefined" && teacherNameBusy) &&
      !(typeof seatLoadCount !== "undefined" && seatLoadCount > 0)
    )
      return;
    event.preventDefault();
    event.returnValue = "";
  });
  function resetExtras() {
    extraLoadId++;
    extraCurrent = extraEmptyState();
    extraDirectory = null;
    extraDirectoryLoading = false;
    extraDirectoryError = "";
    extraLeaveApproved = false;
    extraElement("search").value = "";
    extraElement("search").disabled = true;
    extraElement("all").disabled = true;
    extraElement("all").onclick = null;
    extraElement("count").textContent = "0명";
    document.querySelectorAll("[data-extra-action]").forEach((button) => {
      button.disabled = true;
    });
    ["results", "list", "search-status", "status", "message"].forEach((id) =>
      extraElement(id).replaceChildren(),
    );
  }
  async function loadExtraDirectory() {
    if (extraDirectory || extraDirectoryLoading || !token) return;
    const epoch = teacherEpoch;
    extraDirectoryLoading = true;
    extraDirectoryError = "";
    renderExtraSearch();
    try {
      const directory = unwrap(
        await callServer("teacherExtraDirectory", token),
      );
      if (epoch === teacherEpoch) extraDirectory = directory;
    } catch (error) {
      if (epoch !== teacherEpoch) return;
      if (error.code?.startsWith("AUTH")) return authFail();
      extraDirectoryError = "학생명단을 불러오지 못했습니다.";
    } finally {
      if (epoch === teacherEpoch) {
        extraDirectoryLoading = false;
        renderExtraSearch();
      }
    }
  }
  function applyExtraView(state, view) {
    state.date = view.date;
    state.period = view.period;
    state.readOnly = view.readOnly;
    state.generations = view.generations || {};
    state.errors = view.errors || [];
    state.rows = new Map(
      view.students.map((row) => {
        const value = row.values[view.period - 1];
        const previous = view.period > 1 ? row.values[view.period - 2] : "";
        const checked = value ? value === "2" : previous !== "3";
        return [
          row.studentId,
          {
            ...row,
            values: [...row.values],
            isNew: false,
            checked,
            initialChecked: checked,
            generation: state.generations[row.studentId] || "0",
          },
        ];
      }),
    );
  }
  async function loadExtras() {
    if (!token || extraOperationBusy()) return;
    if (extraPending() && !extraLeaveApproved) return;
    extraLeaveApproved = false;
    void loadExtraDirectory();
    const state = extraCurrent;
    const date = document.getElementById("date").value;
    const period = Number(document.getElementById("period").value);
    const epoch = teacherEpoch;
    const loadId = ++extraLoadId;
    state.loading = true;
    state.notice = "";
    renderExtras();
    try {
      const view = unwrap(
        await callServer("getTeacherExtras", token, date, period),
      );
      if (epoch !== teacherEpoch || loadId !== extraLoadId) return;
      applyExtraView(state, view);
      state.request = null;
    } catch (error) {
      if (epoch !== teacherEpoch || loadId !== extraLoadId) return;
      if (error.code?.startsWith("AUTH")) return authFail();
      state.readOnly = true;
      state.notice =
        "다시 읽지 못해 미신청자 초안과 대기 요청을 유지합니다. " +
        error.message;
    } finally {
      if (epoch === teacherEpoch && loadId === extraLoadId) {
        state.loading = false;
        renderExtras();
      }
    }
  }
  function extraButton(text, handler, className = "secondary") {
    const button = document.createElement("button");
    button.type = "button";
    button.className = className;
    button.textContent = text;
    button.onclick = handler;
    return button;
  }
  function extraEditable(state) {
    return (
      !!token &&
      !state.readOnly &&
      !extraBusy(state) &&
      !extraOperationBusy() &&
      !state.errors.length &&
      state.date === document.getElementById("date").value &&
      state.period === Number(document.getElementById("period").value)
    );
  }
  function renderExtraSearch() {
    const state = extraCurrent;
    const root = extraElement("results");
    const disabled = !extraEditable(state);
    extraElement("search").disabled = disabled;
    root.replaceChildren();
    if (!extraDirectory) {
      extraElement("search-status").textContent = extraDirectoryLoading
        ? "학생명단 불러오는 중..."
        : extraDirectoryError;
      return;
    }
    const query = extraElement("search").value.trim().toLocaleLowerCase();
    const matches = query
      ? extraDirectory.filter(
          (student) =>
            student.name.toLocaleLowerCase().includes(query) ||
            student.studentId.includes(query),
        )
      : [];
    extraElement("search-status").textContent = query
      ? `${matches.length}명 검색됨${matches.length > 40 ? " · 처음 40명 표시" : ""}`
      : "";
    matches.slice(0, 40).forEach((student) => {
      const button = extraButton(`${student.studentId} ${student.name}`, () => {
        if (!extraEditable(state) || state.rows.has(student.studentId)) return;
        state.rows.set(student.studentId, {
          ...student,
          values: ["", "", ""],
          isNew: true,
          checked: true,
          initialChecked: true,
          generation: state.generations[student.studentId] || "0",
        });
        extraLeaveApproved = false;
        state.notice = "";
        renderExtras();
      });
      button.disabled = disabled || state.rows.has(student.studentId);
      root.appendChild(button);
    });
  }
  function renderExtras() {
    if (!token) return;
    const state = extraCurrent;
    const editable = extraEditable(state);
    const rows = Array.from(state.rows.values()).sort((a, b) =>
      a.studentId.localeCompare(b.studentId),
    );
    const checkedCount = rows.filter((row) =>
      state.readOnly ? row.values[state.period - 1] === "2" : row.checked,
    ).length;
    extraElement("count").innerHTML =
      `${escapeHtml(state.date)} · ${state.period}교시 - ${rows.length}명 (출석 ${checkedCount}명)` +
      (!state.readOnly
        ? extraPending()
          ? ' · <mark class="save-needed">저장 필요</mark>'
          : ""
        : "");
    extraElement("status").textContent = state.loading
      ? "미신청자 불러오는 중..."
      : state.running
        ? "미신청자 저장 중..."
        : "";
    message(
      extraElement("message"),
      [state.notice, ...state.errors].filter(Boolean).join("\n"),
      "error",
    );
    if (state.request && !state.running && !state.loading) {
      const discard = extraButton("대기 취소 · 서버 다시 읽기", () => {
        if (
          !window.confirm(
            "미신청자 초안과 대기 요청의 재시도를 포기하고 서버에서 다시 읽을까요?\n결과를 확인하지 못한 요청은 이미 저장되었거나 나중에 반영될 수 있습니다. 서버에 전송한 요청은 취소되지 않으며 저장된 결과도 유지됩니다.",
          )
        )
          return;
        extraLeaveApproved = true;
        void loadExtras();
      });
      extraElement("message").classList.remove("hidden");
      extraElement("message").appendChild(discard);
    }
    const all = rows.length > 0 && checkedCount === rows.length;
    extraElement("all").textContent = all ? "전체 해제" : "전체 선택";
    extraElement("all").disabled = !editable || !rows.length;
    extraElement("all").onclick = () => {
      if (!extraEditable(state)) return;
      state.rows.forEach((row) => {
        row.checked = !all;
      });
      extraLeaveApproved = false;
      renderExtras();
    };
    document.querySelectorAll("[data-extra-action]").forEach((button) => {
      const action = button.dataset.extraAction;
      if (action === "save") {
        button.textContent = state.request
          ? state.request.action === "save"
            ? "저장 재시도"
            : "삭제 재시도"
          : "저장";
        button.disabled = state.request
          ? state.running || state.loading
          : !editable || !rows.length;
      } else if (action === "removeAll") {
        button.textContent = "모두 삭제";
        button.disabled = !editable || !rows.length;
      }
    });
    const root = extraElement("list");
    const focused = root.contains(document.activeElement)
      ? document.activeElement.dataset.extraFocus
      : null;
    root.setAttribute("aria-busy", String(state.running || state.loading));
    root.replaceChildren();
    rows.forEach((row) => {
      const id = row.studentId;
      const actual = row.values[state.period - 1];
      const value = state.readOnly ? actual : row.checked ? "2" : "3";
      const li = document.createElement("li");
      li.className = `extra-item${value === "2" ? " extra-present" : value === "3" ? " extra-absent" : ""}`;
      const label = document.createElement("label");
      label.className = "extra-choice";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.dataset.extraFocus = `${id}:check`;
      checkbox.checked = state.readOnly ? actual === "2" : row.checked;
      checkbox.disabled = !editable;
      checkbox.onchange = () => {
        if (!extraEditable(state)) return;
        row.checked = checkbox.checked;
        extraLeaveApproved = false;
        renderExtras();
      };
      const text = document.createElement("span");
      text.textContent = `${row.name} (${id})`;
      label.append(checkbox, text);
      const badge = document.createElement("span");
      badge.className = "extra-badge";
      const extraStatusLabel = (status) =>
        status === "2" ? "출석" : status === "3" ? "결석" : "없음";
      const previousLabel = extraStatusLabel(actual);
      const plannedLabel = extraStatusLabel(value);
      badge.textContent =
        !state.readOnly && previousLabel !== plannedLabel
          ? `${previousLabel} → ${plannedLabel}`
          : state.readOnly
            ? previousLabel
            : plannedLabel;
      li.append(label, badge);
      if (!state.readOnly) {
        const remove = extraButton("×", () => removeExtra(row), "secondary");
        remove.setAttribute("aria-label", `${row.name} (${id}) 미신청자 삭제`);
        remove.title = "1~3교시 모두 삭제";
        remove.dataset.extraFocus = `${id}:remove`;
        remove.disabled = !editable;
        li.appendChild(remove);
      }
      root.appendChild(li);
    });
    if (!rows.length) {
      const empty = document.createElement("li");
      empty.textContent = "추가된 미신청자가 없습니다.";
      root.appendChild(empty);
    }
    if (focused)
      Array.from(root.querySelectorAll("[data-extra-focus]"))
        .find(
          (control) =>
            control.dataset.extraFocus === focused && !control.disabled,
        )
        ?.focus({ preventScroll: true });
    renderExtraSearch();
  }
  function extraSelection(row) {
    return {
      studentId: row.studentId,
      generation: row.generation,
      isNew: row.isNew,
      checked: row.checked,
    };
  }
  function removeExtra(row) {
    const state = extraCurrent;
    if (!extraEditable(state)) return;
    if (row.isNew) {
      state.rows.delete(row.studentId);
      extraLeaveApproved = false;
      return renderExtras();
    }
    if (
      !window.confirm(
        `${state.date} ${row.name} (${row.studentId}) 학생과 학생의 1-3교시 출결 정보를 모두 삭제할까요?`,
      )
    )
      return;
    void submitExtras("remove", [extraSelection(row)]);
  }
  async function submitExtras(action, selections) {
    const state = extraCurrent;
    if (!token || extraOperationBusy() || state.loading) return;
    if (!state.request) {
      if (!extraEditable(state)) return;
      state.request = Object.freeze({
        date: state.date,
        period: state.period,
        action,
        selections: Object.freeze(
          selections.map((item) => Object.freeze({ ...item })),
        ),
        requestId: crypto.randomUUID(),
      });
    }
    const request = state.request;
    const epoch = teacherEpoch;
    state.running = true;
    extraOperationCount++;
    state.notice = "";
    extraLeaveApproved = false;
    renderExtras();
    try {
      const result = unwrap(
        await callServer(
          "teacherExtraSave",
          token,
          request.date,
          request.period,
          request.action,
          request.selections,
          request.requestId,
        ),
      );
      if (epoch !== teacherEpoch || state !== extraCurrent) return;
      // Row deletion must not throw away unrelated, unsaved checkbox changes or new rows.
      const drafts = request.action === "remove" ? new Map(state.rows) : null;
      applyExtraView(state, result.view);
      if (drafts)
        drafts.forEach((row, id) => {
          if (id === request.selections[0].studentId) return;
          const latest = state.rows.get(id);
          if (
            row.isNew &&
            !latest &&
            row.generation === (state.generations[id] || "0")
          )
            state.rows.set(id, row);
          else if (
            latest &&
            latest.generation === row.generation &&
            (row.isNew || row.checked !== row.initialChecked)
          )
            latest.checked = row.checked;
        });
      state.request = null;
      state.notice = "";
    } catch (error) {
      if (epoch !== teacherEpoch || state !== extraCurrent) return;
      if (error.code?.startsWith("AUTH")) return authFail();
      // Even a server error may follow a durable intent. Never regenerate its UUID or payload.
      state.notice = `${error.message || "결과를 확인하지 못했습니다."} 같은 요청을 재시도하거나 초안을 버리고 서버에서 다시 읽어 주세요. 결과를 확인할 때까지 초안 변경은 잠겨 있습니다.`;
    } finally {
      extraOperationCount--;
      if (epoch === teacherEpoch && state === extraCurrent) {
        state.running = false;
        renderExtras();
      }
    }
  }
  extraElement("search").addEventListener("input", renderExtraSearch);
  document.querySelectorAll("[data-extra-action]").forEach((button) => {
    button.onclick = () => {
      const state = extraCurrent;
      const action = button.dataset.extraAction;
      if (action === "save" && state.request) return void submitExtras();
      if (!extraEditable(state)) return;
      if (action === "save") {
        if (state.rows.size)
          void submitExtras(
            "save",
            Array.from(state.rows.values(), extraSelection),
          );
      } else if (action === "removeAll") {
        if (
          !window.confirm(
            `${state.date} 미신청자 목록과 1~3교시 출결값을 모두 삭제할까요?`,
          )
        )
          return;
        const saved = Array.from(state.rows.values()).filter(
          (row) => !row.isNew,
        );
        if (!saved.length) {
          state.rows.clear();
          extraLeaveApproved = false;
          renderExtras();
          return;
        }
        void submitExtras("removeAll", saved.map(extraSelection));
      }
    };
  });
</script>
