<!doctype html>
<html lang="ko">
  <head>
    <base target="_top" />
    <?!= include('Styles'); ?>
  </head>
  <body>
    <main>
      <div class="topbar">
        <div>
          <nav>
            <a href="<?= appUrl ?>" data-loading-label="메인 화면 불러오는 중…">
              ← 메인
            </a>
          </nav>
          <h1>교사 좌석 및 출결 관리</h1>
        </div>
        <button id="logout" class="secondary" type="button">로그아웃</button>
      </div>
      <div id="teacher-loading" class="page-loading" role="status">
        <span class="loading-spinner" aria-hidden="true"></span>
        <strong>불러오는 중...</strong>
      </div>
      <div id="config-error" class="notice error hidden"></div>
      <form id="teacher-login" class="card stack hidden">
        <h2>교사 로그인</h2>
        <label>
          교사 비밀번호
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>
        <button type="submit">로그인</button>
        <div id="login-message" class="notice hidden"></div>
      </form>
      <section id="teacher-content" class="hidden stack">
        <div class="card row">
          <label>
            날짜
            <select id="date"></select>
          </label>
          <label>
            교시
            <select id="period">
              <option value="1">1교시</option>
              <option value="2">2교시</option>
              <option value="3">3교시</option>
            </select>
          </label>
          <button id="refresh" type="button">새로고침</button>
        </div>
        <div id="message" class="notice hidden"></div>
        <section id="validation-card" class="card hidden">
          <h2>명부 확인 필요</h2>
          <div id="errors" class="errors"></div>
        </section>
        <section id="seat-card" class="card">
          <div class="seat-wrap"><div id="seats" class="seats"></div></div>
          <div id="batch-actions" class="batch-actions hidden">
            <strong id="selected-count">0명 선택됨</strong>
            <button id="mark-present" type="button">출석</button>
            <button id="mark-absence" class="danger" type="button">결석</button>
            <button id="restore" class="secondary" type="button">
              되돌리기
            </button>
            <button id="clear-selection" class="secondary" type="button">
              선택 해제
            </button>
          </div>
        </section>
      </section>
      <dialog id="seat-dialog">
        <div class="card stack">
          <div class="topbar">
            <h2>좌석 상세</h2>
            <button id="close-dialog" class="secondary" type="button">
              닫기
            </button>
          </div>
          <div id="seat-detail"></div>
        </div>
      </dialog>
    </main>
    <script>
      const bootstrap = <?!= bootstrap ?>;
    </script>
    <?!= include('Client'); ?>
    <script>
      let token = localStorage.getItem("sgs_teacher_token"),
        current = null,
        selectedKeys = new Set(),
        seatLoadCount = 0;
      function setTeacherLoading(loading) {
        document
          .getElementById("teacher-loading")
          .classList.toggle("hidden", !loading);
      }
      function setSeatsLoading(loading) {
        seatLoadCount = Math.max(0, seatLoadCount + (loading ? 1 : -1));
        const card = document.getElementById("seat-card");
        const busy = seatLoadCount > 0;
        card.toggleAttribute("inert", busy);
        card.setAttribute("aria-busy", String(busy));
        card.classList.toggle("loading", busy);
      }
      function authFail() {
        localStorage.removeItem("sgs_teacher_token");
        token = null;
        selectedKeys.clear();
        setTeacherLoading(false);
        document.getElementById("teacher-content").classList.add("hidden");
        document.getElementById("teacher-login").classList.remove("hidden");
      }
      function renderSeats(v) {
        current = v;
        selectedKeys.clear();
        const root = document.getElementById("seats");
        root.innerHTML = "";
        v.seats.forEach((s) => {
          const slot = document.createElement("div");
          slot.className = "seat-slot";
          const seat = document.createElement("div");
          seat.className = `seat ${s.status}`;
          if (s.student) {
            seat.dataset.studentKey = s.student.key;
            seat.innerHTML = `<button class="seat-info" type="button" aria-label="${escapeHtml(s.student.name)} 학생 상세 정보">i</button><button class="seat-body" type="button" aria-pressed="false"><strong>${s.seat}번</strong><span>${escapeHtml(s.student.studentId)}</span><span>${escapeHtml(s.student.name)}</span><small>${escapeHtml(s.label)}</small></button>`;
            seat.querySelector(".seat-body").onclick = () =>
              toggleSeat(s.student.key);
            seat.querySelector(".seat-info").onclick = (e) => {
              e.stopPropagation();
              openSeat(s);
            };
          } else {
            seat.innerHTML = `<strong>${s.seat}번</strong><span>빈 좌석</span>`;
          }
          slot.appendChild(seat);
          root.appendChild(slot);
        });
        updateSelectionUi();
        const card = document.getElementById("validation-card");
        card.classList.toggle("hidden", !v.errors.length);
        document.getElementById("errors").innerHTML = v.errors
          .map(escapeHtml)
          .join("<br>");
      }
      function toggleSeat(studentKey) {
        if (seatLoadCount) return;
        if (selectedKeys.has(studentKey)) selectedKeys.delete(studentKey);
        else selectedKeys.add(studentKey);
        updateSelectionUi();
      }
      function updateSelectionUi() {
        document.querySelectorAll(".seat[data-student-key]").forEach((seat) => {
          const selected = selectedKeys.has(seat.dataset.studentKey);
          seat.classList.toggle("selected", selected);
          seat
            .querySelector(".seat-body")
            .setAttribute("aria-pressed", String(selected));
        });
        const count = selectedKeys.size;
        document.getElementById("selected-count").textContent =
          `${count}명 선택됨`;
        document
          .getElementById("batch-actions")
          .classList.toggle("hidden", count === 0);
      }
      function openSeat(s) {
        if (seatLoadCount) return;
        document.getElementById("seat-detail").innerHTML =
          `<p><strong>${escapeHtml(s.student.name)}</strong> (${escapeHtml(s.student.studentId)})</p><p>좌석: ${s.seat}번<br>신청 교시: ${s.appliedPeriods.join(", ")}교시<br>현재 상태: ${escapeHtml(s.label)}</p>`;
        document.getElementById("seat-dialog").showModal();
      }
      async function loadSeats() {
        const b = document.getElementById("refresh");
        const dialog = document.getElementById("seat-dialog");
        if (dialog.open) dialog.close();
        setSeatsLoading(true);
        setBusy(b, true);
        try {
          renderSeats(
            unwrap(
              await callServer(
                "getTeacherSeats",
                token,
                document.getElementById("date").value,
                Number(document.getElementById("period").value),
              ),
            ),
          );
        } catch (e) {
          if (e.code?.startsWith("AUTH")) authFail();
          else message(document.getElementById("message"), e.message, "error");
        } finally {
          setBusy(b, false);
          setSeatsLoading(false);
        }
      }
      async function change(action, button) {
        if (seatLoadCount || !selectedKeys.size) return;
        setBusy(button, true);
        document
          .querySelectorAll("#batch-actions button")
          .forEach((item) => (item.disabled = true));
        try {
          const d = unwrap(
            await callServer(
              "teacherBatchChange",
              token,
              Array.from(selectedKeys),
              current.date,
              current.period,
              action,
            ),
          );
          renderSeats(d.view);
          message(
            document.getElementById("message"),
            `${d.changed}개 교시를 변경했습니다.`,
            "success",
          );
        } catch (e) {
          if (e.code?.startsWith("AUTH")) authFail();
          else message(document.getElementById("message"), e.message, "error");
        } finally {
          setBusy(button, false);
          document
            .querySelectorAll("#batch-actions button")
            .forEach((item) => (item.disabled = false));
        }
      }
      async function init() {
        setTeacherLoading(true);
        document.getElementById("teacher-login").classList.add("hidden");
        document.getElementById("teacher-content").classList.add("hidden");
        if (!setupConfigGate("teacher-content", "config-error")) {
          setTeacherLoading(false);
          return;
        }
        if (!token) return authFail();
        try {
          const [base, dates] = await Promise.all([
            callServer("teacherBootstrap", token),
            callServer("teacherSchedule", token),
          ]).then((x) => x.map(unwrap));
          const sel = document.getElementById("date");
          sel.innerHTML = "";
          dates.forEach((d) => sel.add(new Option(d, d)));
          if (!dates.includes(base.defaultDate))
            sel.add(new Option(base.defaultDate, base.defaultDate));
          sel.value = base.defaultDate;
          document.getElementById("period").value = String(base.defaultPeriod);
          await loadSeats();
          if (!token) return;
          setTeacherLoading(false);
          document.getElementById("teacher-content").classList.remove("hidden");
        } catch (e) {
          authFail();
        }
      }
      document.getElementById("teacher-login").onsubmit = async (e) => {
        e.preventDefault();
        const b = e.submitter;
        setBusy(b, true);
        try {
          const d = unwrap(
            await callServer(
              "teacherLogin",
              document.getElementById("password").value,
            ),
          );
          token = d.token;
          localStorage.setItem("sgs_teacher_token", token);
          document.getElementById("password").value = "";
          await init();
        } catch (err) {
          message(
            document.getElementById("login-message"),
            err.message,
            "error",
          );
        } finally {
          setBusy(b, false);
        }
      };
      document.getElementById("refresh").onclick = loadSeats;
      document.getElementById("date").onchange = loadSeats;
      document.getElementById("period").onchange = loadSeats;
      document.getElementById("close-dialog").onclick = () =>
        document.getElementById("seat-dialog").close();
      document.getElementById("mark-present").onclick = (e) =>
        change("present", e.currentTarget);
      document.getElementById("mark-absence").onclick = (e) =>
        change("absent", e.currentTarget);
      document.getElementById("restore").onclick = (e) =>
        change("restore", e.currentTarget);
      document.getElementById("clear-selection").onclick = () => {
        selectedKeys.clear();
        updateSelectionUi();
      };
      document.getElementById("logout").onclick = async () => {
        const oldToken = token;
        authFail();
        if (oldToken) await callServer("teacherLogout", oldToken);
      };
      setupNavigationFeedback();
      init();
    </script>
  </body>
</html>
