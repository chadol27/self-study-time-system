<!doctype html>
<html lang="ko">
  <head>
    <base target="_top" />
    <?!= include('Styles'); ?>
  </head>
  <body>
    <main>
      <nav><a href="<?= appUrl ?>">← 메인</a></nav>
      <h1>학생 사전 결석 관리</h1>
      <div id="config-error" class="notice error hidden"></div>
      <section id="student-content" class="stack">
        <form id="login" class="card stack">
          <h2>학생 로그인</h2>
          <label>
            학번
            <input
              id="student-id"
              type="text"
              inputmode="numeric"
              autocomplete="username"
              required
            />
          </label>
          <label>
            전화번호 뒤 4자리
            <input
              id="pin"
              type="password"
              inputmode="numeric"
              pattern="[0-9]{4}"
              maxlength="4"
              autocomplete="current-password"
              required
            />
          </label>
          <button type="submit">로그인</button>
          <div id="login-message" class="notice hidden"></div>
        </form>
        <div id="dashboard" class="hidden stack">
          <section class="card">
            <div class="topbar">
              <div>
                <strong id="identity"></strong>
                <div id="deadline" class="muted"></div>
              </div>
              <button id="student-logout" class="secondary" type="button">
                로그아웃
              </button>
            </div>
          </section>
          <form id="absence-form" class="card stack">
            <h2>사전 결석 등록</h2>
            <div class="row">
              <label>
                시작일
                <input id="start-date" type="date" required />
              </label>
              <label>
                종료일
                <input id="end-date" type="date" required />
              </label>
            </div>
            <p class="muted">
              월~목 운영일 중 신청한 모든 교시에 적용됩니다. 주말과 미운영일은
              제외됩니다.
            </p>
            <button type="submit">등록</button>
            <div id="absence-message" class="notice hidden"></div>
          </form>
          <section class="card">
            <h2>등록한 사전 결석</h2>
            <ul id="absence-list" class="list"></ul>
          </section>
        </div>
      </section>
    </main>
    <script>
      const bootstrap = <?!= bootstrap ?>;
    </script>
    <?!= include('Client'); ?>
    <script>
      let studentKey = null,
        view = null;
      function render(v) {
        view = v;
        studentKey = v.studentKey;
        document.getElementById("login").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        document.getElementById("identity").textContent =
          `${v.name} (${v.studentId})`;
        document.getElementById("deadline").textContent = v.todayClosed
          ? "오늘 결석 변경은 마감되었습니다."
          : "오늘 결석 변경이 가능합니다.";
        for (const id of ["start-date", "end-date"]) {
          const e = document.getElementById(id);
          e.min = v.today;
          e.max = v.maxDate;
          if (!e.value) e.value = v.today;
        }
        const ul = document.getElementById("absence-list");
        ul.innerHTML = "";
        if (!v.absences.length) {
          ul.innerHTML = '<li class="muted">등록된 사전 결석이 없습니다.</li>';
        }
        v.absences.forEach((a) => {
          const li = document.createElement("li");
          li.innerHTML = `<strong>${escapeHtml(a.date)}</strong> · ${a.periods.join(", ")}교시 `;
          const b = document.createElement("button");
          b.className = "secondary";
          b.textContent = a.cancellable ? "취소" : "취소 마감";
          b.disabled = !a.cancellable;
          b.onclick = async () => {
            setBusy(b, true);
            try {
              render(
                unwrap(
                  await callServer("cancelStudentAbsence", studentKey, a.date),
                ),
              );
            } catch (e) {
              alert(e.message);
            } finally {
              setBusy(b, false);
            }
          };
          li.appendChild(b);
          ul.appendChild(li);
        });
      }
      if (setupConfigGate("student-content", "config-error")) {
        document.getElementById("login").onsubmit = async (e) => {
          e.preventDefault();
          const b = e.submitter;
          setBusy(b, true);
          try {
            render(
              unwrap(
                await callServer(
                  "studentLogin",
                  document.getElementById("student-id").value,
                  document.getElementById("pin").value,
                ),
              ),
            );
          } catch (err) {
            message(
              document.getElementById("login-message"),
              err.message,
              "error",
            );
          } finally {
            setBusy(b, false);
          }
        };
        document.getElementById("absence-form").onsubmit = async (e) => {
          e.preventDefault();
          const b = e.submitter;
          setBusy(b, true);
          try {
            const d = unwrap(
              await callServer(
                "registerStudentAbsence",
                studentKey,
                document.getElementById("start-date").value,
                document.getElementById("end-date").value,
              ),
            );
            render(d);
            message(
              document.getElementById("absence-message"),
              `${d.appliedCount}개 운영일에 적용했습니다: ${d.appliedDates.join(", ") || "변경 없음"}`,
              "success",
            );
          } catch (err) {
            message(
              document.getElementById("absence-message"),
              err.message,
              "error",
            );
          } finally {
            setBusy(b, false);
          }
        };
        document.getElementById("student-logout").onclick = () => {
          studentKey = null;
          view = null;
          document.getElementById("dashboard").classList.add("hidden");
          document.getElementById("login").reset();
          document.getElementById("login").classList.remove("hidden");
          message(document.getElementById("login-message"), "");
          message(document.getElementById("absence-message"), "");
          document.getElementById("student-id").focus();
        };
      }
    </script>
  </body>
</html>
