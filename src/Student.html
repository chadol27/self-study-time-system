<!doctype html>
<html lang="ko">
  <head>
    <base target="_top" />
    <?!= include('Styles'); ?>
  </head>
  <body>
    <main>
      <nav>
        <a href="<?= appUrl ?>" data-loading-label="메인 화면 불러오는 중…">
          ← 메인
        </a>
      </nav>
      <h1>결석일 사전 등록</h1>
      <div id="config-error" class="notice error hidden"></div>
      <section id="student-content" class="stack">
        <form id="login" class="card stack">
          <label>
            학번
            <input
              id="student-id"
              type="text"
              inputmode="numeric"
              autocomplete="username"
              required
            />
          </label>
          <label>
            전화번호 뒷자리
            <input
              id="pin"
              type="password"
              inputmode="numeric"
              pattern="[0-9]{4}"
              maxlength="4"
              autocomplete="current-password"
              required
            />
          </label>
          <button type="submit">로그인</button>
          <div id="login-message" class="notice hidden"></div>
        </form>
        <div id="dashboard" class="hidden stack">
          <section class="card">
            <div class="topbar">
              <div>
                <strong id="identity"></strong>
              </div>
              <button id="student-logout" class="secondary" type="button">
                로그아웃
              </button>
            </div>
          </section>
          <form id="absence-form" class="card stack">
            <h2>결석일 등록</h2>
            <div class="row">
              <label>
                시작일
                <input id="start-date" type="date" required />
              </label>
              <label>
                종료일
                <input id="end-date" type="date" required />
              </label>
            </div>
            <button type="submit">등록</button>
            <div id="absence-message" class="notice hidden"></div>
          </form>
          <section class="card">
            <h2>등록된 결석일</h2>
            <div class="absence-actions">
              <strong id="selected-absence-count">0일 선택됨</strong>
              <button
                id="cancel-absences"
                class="danger"
                type="button"
                disabled
              >
                선택한 결석 취소
              </button>
            </div>
            <ul id="absence-list" class="list"></ul>
          </section>
        </div>
      </section>
    </main>
    <script>
      const bootstrap = <?!= bootstrap ?>;
    </script>
    <?!= include('Client'); ?>
    <script>
      const STUDENT_LOGIN_DURATION_MS = 5 * 60 * 1000;
      let studentKey = null,
        studentExpiresAt = 0,
        studentExpiryTimer = null,
        view = null;
      function logoutStudent() {
        if (studentExpiryTimer) clearTimeout(studentExpiryTimer);
        studentExpiryTimer = null;
        studentKey = null;
        studentExpiresAt = 0;
        view = null;
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("login").reset();
        document.getElementById("login").classList.remove("hidden");
        message(document.getElementById("login-message"), "");
        message(document.getElementById("absence-message"), "");
        document.getElementById("student-id").focus();
      }
      function hasActiveStudentLogin() {
        if (studentKey && Date.now() < studentExpiresAt) return true;
        logoutStudent();
        return false;
      }
      function startStudentLogin(v) {
        studentKey = v.studentKey;
        studentExpiresAt = Date.now() + STUDENT_LOGIN_DURATION_MS;
        studentExpiryTimer = setTimeout(
          logoutStudent,
          STUDENT_LOGIN_DURATION_MS,
        );
        render(v);
      }
      function nextDateKey(key) {
        const date = new Date(`${key}T00:00:00Z`);
        date.setUTCDate(date.getUTCDate() + 1);
        return date.toISOString().slice(0, 10);
      }
      function selectedAbsenceDates() {
        return Array.from(
          document.querySelectorAll("#absence-list input:checked"),
          (input) => input.value,
        );
      }
      function updateAbsenceSelectionUi() {
        const count = selectedAbsenceDates().length;
        document.getElementById("selected-absence-count").textContent =
          `${count}일 선택됨`;
        document.getElementById("cancel-absences").disabled = count === 0;
      }
      function render(v) {
        view = v;
        document.getElementById("login").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        document.getElementById("identity").textContent =
          `${v.name} (${v.studentId})`;
        const start = document.getElementById("start-date");
        const startMin = v.todayClosed ? nextDateKey(v.today) : v.today;
        start.min = startMin;
        start.max = v.maxDate;
        if (!start.value || start.value < startMin) start.value = startMin;
        const end = document.getElementById("end-date");
        end.min = startMin;
        end.max = v.maxDate;
        if (!end.value || end.value < startMin) end.value = startMin;
        const ul = document.getElementById("absence-list");
        ul.innerHTML = "";
        if (!v.absences.length) {
          ul.innerHTML = '<li class="muted">결석일이 없습니다.</li>';
        }
        v.absences.forEach((a) => {
          const li = document.createElement("li");
          const label = document.createElement("label");
          label.className = "absence-choice";
          const input = document.createElement("input");
          input.type = "checkbox";
          input.value = a.date;
          input.disabled = !a.cancellable;
          input.dataset.cancellable = String(a.cancellable);
          input.onchange = updateAbsenceSelectionUi;
          const text = document.createElement("span");
          text.innerHTML = `<strong>${escapeHtml(a.date)}</strong>${a.cancellable ? "" : '<small class="muted">취소 불가</small>'}`;
          label.append(input, text);
          li.appendChild(label);
          ul.appendChild(li);
        });
        updateAbsenceSelectionUi();
      }
      if (setupConfigGate("student-content", "config-error")) {
        document.getElementById("login").onsubmit = async (e) => {
          e.preventDefault();
          const b = e.submitter;
          setBusy(b, true);
          try {
            startStudentLogin(
              unwrap(
                await callServer(
                  "studentLogin",
                  document.getElementById("student-id").value,
                  document.getElementById("pin").value,
                ),
              ),
            );
          } catch (err) {
            message(
              document.getElementById("login-message"),
              err.message,
              "error",
            );
          } finally {
            setBusy(b, false);
          }
        };
        document.getElementById("absence-form").onsubmit = async (e) => {
          e.preventDefault();
          if (!hasActiveStudentLogin()) return;
          const b = e.submitter;
          setBusy(b, true);
          try {
            const d = unwrap(
              await callServer(
                "registerStudentAbsence",
                studentKey,
                document.getElementById("start-date").value,
                document.getElementById("end-date").value,
              ),
            );
            if (!hasActiveStudentLogin()) return;
            render(d);
            message(
              document.getElementById("absence-message"),
              `${d.appliedCount}일 적용했습니다: ${d.appliedDates.join(", ") || "변경 없음"}`,
              "success",
            );
          } catch (err) {
            message(
              document.getElementById("absence-message"),
              err.message,
              "error",
            );
          } finally {
            setBusy(b, false);
          }
        };
        document.getElementById("cancel-absences").onclick = async (e) => {
          if (!hasActiveStudentLogin()) return;
          const b = e.currentTarget;
          const dates = selectedAbsenceDates();
          if (!dates.length) return;
          const checkboxes = Array.from(
            document.querySelectorAll("#absence-list input"),
          );
          setBusy(b, true);
          checkboxes.forEach((input) => (input.disabled = true));
          try {
            const d = unwrap(
              await callServer("cancelStudentAbsences", studentKey, dates),
            );
            if (!hasActiveStudentLogin()) return;
            render(d);
            message(
              document.getElementById("absence-message"),
              `${d.cancelledCount}일 취소했습니다: ${d.cancelledDates.join(", ")}`,
              "success",
            );
          } catch (err) {
            message(
              document.getElementById("absence-message"),
              err.message,
              "error",
            );
          } finally {
            checkboxes.forEach(
              (input) =>
                (input.disabled = input.dataset.cancellable !== "true"),
            );
            setBusy(b, false);
            updateAbsenceSelectionUi();
          }
        };
        document.getElementById("student-logout").onclick = logoutStudent;
      }
      setupNavigationFeedback();
    </script>
  </body>
</html>
